<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050608" />
    <title>Hacky</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
        <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
    <body>
    <canvas id="matrix-rain" class="matrix-rain" aria-hidden="true"></canvas>
    <main class="hero">
      <div class="hero__copy">
        <p class="eyebrow">Welcome</p>
        <h1>to Hacky</h1>
        <p class="intro">
        </p>
      </div>

      <section class="visual" aria-label="Hacky, your 3D rubber duck assistant">
        <div
          id="hacky-stage"
          class="hacky-stage"
          role="button"
          tabindex="0"
          aria-label="Ask Hacky for advice"
        ></div>
        <aside id="speech-bubble" class="speech-bubble" aria-hidden="true">
          <span class="speech-bubble__label">Hacky says</span>
          <p id="hacky-advice" class="speech-bubble__message" aria-live="polite"></p>
        </aside>
        <p id="model-status" class="model-status" role="status">Waking Hacky…</p>
        <div class="visual__wash" aria-hidden="true"></div>


      </section>


    </main>

    <noscript>This prototype needs JavaScript enabled.</noscript>
    <audio id="hacky-quack" src="./assets/quack.mp3" preload="auto"></audio>
    <script type="module" src="./main.js"></script>
  </body>
</html>
